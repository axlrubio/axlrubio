name: Generar gráficos del perfil

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza cada 12 horas
  workflow_dispatch:          # botón para ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Gráfico de actividad (últimos 31 días)
        run: python .github/scripts/activity.py ${{ github.repository_owner }} dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Serpiente de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
